<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>爱心数字雨</title>
<style>
*{margin:0;padding:0}
body{background:#000;overflow:hidden}
canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let w,h;
let fontSize = 18;
let drops = [];
const chars = "0123456789abcdefghijklmnopqrstuvwxyz❤";

// 绘制静态完整爱心（参数方程，稳定成型！）
function drawHeart(cx,cy,scale){
    ctx.beginPath();
    for(let t=0;t<=2*Math.PI;t+=0.01){
        let x = 16*Math.pow(Math.sin(t),3);
        let y = 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
        ctx.lineTo(cx + x*scale, cy - y*scale);
    }
    ctx.closePath();
    ctx.fillStyle="rgba(255, 60, 120,0.22)";
    ctx.fill();
}

function init(){
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
    drops = [];
    const cols = Math.floor(w / fontSize);
    for(let i=0;i<cols;i++){
        drops.push({y:Math.random()*-h})
    }
}
window.onresize = init;
init();

function draw(){
    ctx.fillStyle = "rgba(0,0,0,0.075)";
    ctx.fillRect(0,0,w,h);

    const cx = w/2;
    const cy = h/2;
    const heartScale = 7;
    // 每帧先把完整爱心画出来！
    drawHeart(cx,cy,heartScale);

    // 数字雨下落
    for(let col=0;col<drops.length;col++){
        let y = drops[col].y;
        let x = col*fontSize;
        let ch = chars[Math.floor(Math.random()*chars.length)];
        ctx.fillStyle="#ff88bb";
        ctx.font = fontSize+"px monospace";
        ctx.fillText(ch,x,y);
        drops[col].y += fontSize*1.05;
        if(drops[col].y>h){
            drops[col].y = Math.random()*-100;
        }
    }
    requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
