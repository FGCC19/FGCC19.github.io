<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🌹水晶玫瑰</title>
<style>*{margin:0;padding:0}body{background:#000;overflow:hidden}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize();window.onresize=resize;
let t=0;
function draw(){
ctx.fillStyle='rgba(0,0,0,0.08)';
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.save();
ctx.translate(canvas.width/2,canvas.height/2-80);
for(let i=0;i<2200;i++){
let theta=i*0.012+t*0.0025;
let r=120*Math.sin(2.4*theta);
let x=r*Math.cos(theta);
let y=r*Math.sin(theta);
ctx.fillStyle=`hsl(${330+i*0.04},85%,60%)`;
ctx.beginPath();
ctx.arc(x,y,1.4,0,Math.PI*2);
ctx.fill();
}
ctx.restore();
t++;requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
