<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>🎆烟花特效</title>
<style>
*{margin:0;padding:0}
body{background:#000;overflow:hidden}
</style>
</head>
<body>
<canvas id="fire"></canvas>
<script>
const canvas = document.getElementById("fire");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;
window.addEventListener("resize",()=>{
    canvas.width=innerWidth;
    canvas.height=innerHeight;
})

class Particle{
    constructor(x,y,color,speed,angle,size){
        this.x=x;
        this.y=y;
        this.color=color;
        this.speed=speed;
        this.angle=angle;
        this.size=size;
        this.vx=Math.cos(angle)*speed;
        this.vy=Math.sin(angle)*speed;
        this.alpha=1;
        this.gravity=0.06;
    }
    update(){
        this.x+=this.vx;
        this.y+=this.vy;
        this.vy+=this.gravity;
        this.alpha -=0.012;
    }
    draw(){
        ctx.save();
        ctx.globalAlpha=this.alpha;
        ctx.fillStyle=this.color;
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
    }
}

let list=[];
function createFirework(){
    let x=Math.random()*canvas.width;
    let y=Math.random()*canvas.height*0.4;
    let color=`hsl(${Math.random()*360},100%,65%)`;
    let count=80;
    for(let i=0;i<count;i++){
        let ang=(Math.PI*2/count)*i;
        let sp=Math.random()*4+2;
        list.push(new Particle(x,y,color,sp,ang,Math.random()*2+1))
    }
}

setInterval(createFirework,1200);

function loop(){
    ctx.fillStyle="rgba(0,0,0,0.12)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let i=list.length-1;i>=0;i--){
        list[i].update();
        list[i].draw();
        if(list[i].alpha<=0) list.splice(i,1);
    }
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
